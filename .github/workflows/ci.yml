name: Verify Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_EXTENSION: "src/HealthCheckSlackNotificationMethod"
  DOTNET_VERSION: '10'

on:
  push:
    branches: [ "develop/v5", "release/v5", "beta/v5", "feature/v5/**", "hotfix/v5/**" ]
  pull_request:
    branches: [ "develop/v5", "release/v5", "beta/v5", "feature/v5/**", "hotfix/v5/**" ]
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.set-version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Update .releaserc for current branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" == feature/v4/* ]] || [[ "$BRANCH_NAME" == hotfix/v4/* ]]; then
            # Convert branch name to valid semver prerelease identifier
            PRERELEASE_ID=$(echo "$BRANCH_NAME" | sed 's/\//-/g').alpha
            echo "Adding branch config: $BRANCH_NAME with prerelease: $PRERELEASE_ID"
            
            # Read current .releaserc, add the branch entry, and save
            jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
              '.branches += [{"name": $name, "prerelease": $prerelease}]' \
              .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc
            
            echo "Updated .releaserc:"
            cat .releaserc
          else
            echo "Branch does not match feature/v4/** or hotfix/v4/**, no update needed"
          fi
          
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Set Version
        id: set-version
        run: |
          if [ -n "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "version=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            # Get the latest tag from git
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              # Remove 'v' prefix if present
              LATEST_VERSION=${LATEST_TAG#v}
              echo "version=${LATEST_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            else
              echo "version=0.1.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Echo the version
        run: |
          echo "Version to use: '${{ steps.set-version.outputs.version }}'"
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Dotnet Format check
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: ${{ env.PATH_TO_EXTENSION }}

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release /maxcpucount:1

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}
    
    - name: Install Package Validation Tool
      run: dotnet tool install -g dotnet-validate --prerelease
    
    - name: Validate NuGet Package
      run: dotnet validate package local ${{ env.PATH_TO_EXTENSION }}/bin/Release/Our.Umbraco.HealthCheckSlackNotificationMethod.*.nupkg
